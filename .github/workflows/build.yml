name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write  # 允许创建 Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # 打包用精简清单（requirements-build.txt），不用完整依赖：
          # 后者含 openai-whisper → torch（CPU 版解压 ~1.5GB），
          # 会把发布产物撑到 650MB+。被砍项都有代码级降级路径，
          # 详见 requirements-build.txt 头部说明。
          pip install -r requirements-build.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller oc_pet.spec

      - name: Package dist
        run: |
          cd dist/oc_pet
          powershell -Command "Compress-Archive -Path * -DestinationPath ../oc-pet-${{ github.ref_name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: oc-pet-${{ github.ref_name }}
          path: dist/*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
